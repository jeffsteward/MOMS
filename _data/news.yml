  Content: "The museum has received some attention on a variety of information outlets. Have a look:\r\n\r\n<p><a href=\"http://www.boston.com/yourtown/news/somerville/2011/02/by_danielle_dreilinger_globe_c_66.html\">Your Town Somerville</a></p>\r\n\r\n<p><a href=\"http://quercusdesign.blogspot.com/2011/02/snowglobe-love.html\">Quercus Design</a></p>\r\n\r\n<p><a href=\"http://www.thingsmagazine.net/?p=3315\">things magazine</a></p>\r\n\r\n<p><a href=\"http://www.whorange.net/whorange/2011/02/glorious-globes-from-the-museum-of-modern-snowglobes.html\">WHORANGE</a></p>\r\n\r\n<p><a href=\"http://www.junk-culture.com/2011/01/collections-museum-of-modern-snowglobe.html\">Junk Culture</a></p>"
